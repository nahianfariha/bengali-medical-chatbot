# Hyperparameters used for the reported runs.
# CLI flags in src/train.py override these; this file is just documentation
# of what was actually used, kept alongside the code for reproducibility.

model_name: "Qwen/Qwen2.5-3B-Instruct"
max_length: 768

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

quantization:
  load_in_4bit: true
  quant_type: "nf4"
  compute_dtype: "bfloat16"
  double_quant: true

quick_run:
  sample_size: 5000
  epochs: 1
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 2
  eval_steps: 2000
  save_steps: 2000

full_run:
  sample_size: null
  epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 16
  eval_steps: 500
  save_steps: 500
  use_liger: true

optimizer:
  learning_rate: 2e-4
  weight_decay: 0.01
  optim: "paged_adamw_8bit"
  lr_scheduler_type: "cosine"
  warmup_steps: 100

generation:
  max_new_tokens: 256
  do_sample: false
  repetition_penalty: 1.1
